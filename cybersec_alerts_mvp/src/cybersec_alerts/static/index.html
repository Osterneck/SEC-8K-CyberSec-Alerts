<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEC CyberSec Alerts</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
  header { background: #1a1f2e; border-bottom: 1px solid #2d3748; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  header h1 { font-size: 1.1rem; font-weight: 600; color: #f0f4ff; }
  .mvp-badge { font-size: 0.75rem; background: #2a3550; color: #7ba4d9; padding: 2px 8px; border-radius: 4px; }
  .live-indicator { display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; color: #64748b; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
  main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
  .toolbar { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .toolbar-left { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  button { cursor: pointer; font-size: 0.85rem; font-weight: 500; border: none; border-radius: 6px; padding: 0.5rem 1.1rem; transition: opacity .15s; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #btn-scan { background: #1e40af; color: #dbeafe; }
  #btn-history { background: #1e3a2e; color: #86efac; }
  #status { font-size: 0.8rem; color: #64748b; }
  .badge { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; }
  .badge-critical { background: #7f1d1d; color: #fca5a5; }
  .badge-high     { background: #78350f; color: #fcd34d; }
  .badge-moderate { background: #1e3a8a; color: #93c5fd; }
  .badge-watch    { background: #1e3a2e; color: #86efac; }
  .new-badge { font-size: 0.65rem; background: #166534; color: #bbf7d0; padding: 1px 6px; border-radius: 3px; margin-left: 0.4rem; vertical-align: middle; }
  .item-tag { font-size: 0.65rem; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-left: 0.3rem; vertical-align: middle; }
  .item-tag-105 { background: #4c1d95; color: #ddd6fe; }
  .item-tag-801 { background: #164e63; color: #a5f3fc; }
  .card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 8px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; }
  .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .card-company { font-size: 1rem; font-weight: 600; color: #f0f4ff; }
  .card-meta { font-size: 0.78rem; color: #64748b; margin-bottom: 0.6rem; }
  .score-bar { background: #2d3748; border-radius: 4px; height: 4px; margin-bottom: 0.75rem; }
  .score-fill { height: 4px; border-radius: 4px; background: linear-gradient(90deg,#1e40af,#3b82f6); }
  .card-summary { font-size: 0.875rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.75rem; border-left: 3px solid #3b82f6; padding-left: 0.75rem; }
  .card-links { margin-bottom: 0.5rem; }
  .card-links a { font-size: 0.78rem; color: #3b82f6; text-decoration: none; margin-right: 1rem; }
  .card-links a:hover { text-decoration: underline; }
  .exposures { font-size: 0.75rem; color: #64748b; margin-bottom: 0.75rem; }
  .filing-text-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #475569; margin: 0.75rem 0 0.4rem; }
  .filing-text { background: #0f1117; border: 1px solid #2d3748; border-radius: 4px; padding: 0.85rem 1rem; font-size: 0.78rem; color: #94a3b8; white-space: pre-wrap; line-height: 1.65; max-height: 320px; overflow-y: auto; }
  #empty { text-align: center; color: #475569; padding: 3rem; font-size: 0.9rem; }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>SEC CyberSec Alerts</h1>
    <span class="mvp-badge">MVP</span>
  </div>
  <div class="live-indicator">
    <div class="live-dot"></div>
    <span id="last-updated">Loading...</span>
  </div>
</header>
<main>
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="btn-scan" onclick="runScan()">&#9654; Refresh &amp; Scan</button>
      <button id="btn-history" onclick="loadHistory()">History</button>
      <span id="status"></span>
    </div>
  </div>
  <div id="alerts-container"><div id="empty">Loading most recent alerts...</div></div>
</main>
<script>
var BASE = '';
var status = document.getElementById('status');
var container = document.getElementById('alerts-container');
var lastUpdated = document.getElementById('last-updated');

function setStatus(msg, loading) {
  status.textContent = loading ? '... ' + msg : msg;
}

function formatNow() {
  return new Date().toLocaleString('en-US', {month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
}

function safe(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
}

function urgencyBadge(u) {
  var urg = (u || 'watch').toLowerCase();
  return '<span class="badge badge-' + urg + '">' + urg + '</span>';
}

function itemTag(dtype) {
  if (!dtype) return '';
  if (dtype.indexOf('1_05') > -1 || dtype.indexOf('1.05') > -1) return '<span class="item-tag item-tag-105">1.05</span>';
  if (dtype.indexOf('8_01') > -1 || dtype.indexOf('8.01') > -1) return '<span class="item-tag item-tag-801">8.01</span>';
  return '';
}

function formatDisclosureType(raw) {
  if (!raw) return '';
  if (raw.indexOf('1_05') > -1 || raw.indexOf('1.05') > -1) return 'Item 1.05 - Material Cybersecurity Incident';
  if (raw.indexOf('8_01') > -1 || raw.indexOf('8.01') > -1) return 'Item 8.01 - Voluntary Cybersecurity Disclosure';
  return raw;
}

function formatMateriality(raw) {
  if (!raw) return '';
  if (raw === 'material') return 'Material';
  if (raw === 'not_material') return 'Not Material';
  if (raw === 'undetermined') return 'Materiality Undetermined';
  return raw;
}

function renderCard(a, isNew) {
  var score = a.risk_score || 0;
  var company = a.company_name || '-';
  var summary = a.summary || '';
  var accession = a.accession || '';
  var filingUrl = a.filing_url || a.document_url || '';
  var urgency = a.urgency || 'watch';
  var dtype = formatDisclosureType(a.disclosure_type || '');
  var mat = formatMateriality(a.materiality || '');
  var rendered = a.rendered_text || '';
  var exposuresRaw = a.exposures || a.exposures_json || [];
  var exposures = Array.isArray(exposuresRaw) ? exposuresRaw.join(', ') : (typeof exposuresRaw === 'string' ? exposuresRaw : '');
  var filedAt = a.filed_at ? new Date(a.filed_at).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '';
  var newTag = isNew ? '<span class="new-badge">NEW</span>' : '';

  return '<div class="card">' +
    '<div class="card-header">' +
      urgencyBadge(urgency) +
      itemTag(a.disclosure_type) +
      '<span class="card-company">' + safe(company) + '</span>' + newTag +
      '<span style="font-size:.75rem;color:#475569;margin-left:auto">Score: ' + score + '/100</span>' +
    '</div>' +
    '<div class="score-bar"><div class="score-fill" style="width:' + score + '%"></div></div>' +
    '<div class="card-meta">' + safe(dtype) + (mat ? ' &nbsp;&middot;&nbsp; ' + safe(mat) : '') + (filedAt ? ' &nbsp;&middot;&nbsp; Filed: ' + safe(filedAt) : '') + (accession ? ' &nbsp;&middot;&nbsp; ' + safe(accession) : '') + '</div>' +
    (summary ? '<div class="card-summary">' + safe(summary) + '</div>' : '') +
    (exposures ? '<div class="exposures">Exposures: ' + safe(exposures) + '</div>' : '') +
    '<div class="card-links">' + (filingUrl ? '<a href="' + safe(filingUrl) + '" target="_blank">SEC filing</a>' : '') + '</div>' +
    (rendered ? '<div class="filing-text-label">Full Alert &amp; Filing Language</div><div class="filing-text">' + safe(rendered) + '</div>' : '') +
    '</div>';
}

function renderRows(rows, newAccessions) {
  newAccessions = newAccessions || {};
  if (!rows || !rows.length) {
    container.innerHTML = '<div id="empty">No qualifying cyber alerts found.</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < rows.length; i++) {
    html += renderCard(rows[i], newAccessions[rows[i].accession]);
  }
  container.innerHTML = html;
}

function runScan() {
  setStatus('Scanning EDGAR for Item 1.05 & 8.01 filings...', true);
  document.getElementById('btn-scan').disabled = true;
  fetch(BASE + '/api/scan')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var newSet = {};
      (d.new_alert_accessions || []).forEach(function(a) { newSet[a] = true; });
      renderRows(d.alerts || [], newSet);
      var n = d.new_alerts || 0;
      setStatus(n > 0 ? n + ' new filing(s) detected' : 'Up to date - showing most recent alerts');
      lastUpdated.textContent = 'Last updated: ' + formatNow();
    })
    .catch(function(e) { setStatus('Error: ' + e.message); })
    .finally(function() { document.getElementById('btn-scan').disabled = false; });
}

function loadHistory() {
  setStatus('Loading history...', true);
  fetch(BASE + '/api/history?limit=50')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      renderRows(d.alerts || []);
      setStatus('History - ' + d.count + ' record(s)');
      lastUpdated.textContent = 'Last updated: ' + formatNow();
    })
    .catch(function(e) { setStatus('Error: ' + e.message); });
}

window.addEventListener('load', runScan);
</script>
</body>
</html>
